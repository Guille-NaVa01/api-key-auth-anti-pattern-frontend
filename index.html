<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Exercise — Frontend</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Security API Exercise</h1>
    <p class="subtitle">
      This app calls the backend's protected endpoints and demonstrates sending a
      static <code>x-api-key</code> header from client-side JavaScript.
    </p>

    <section class="card">
      <h2>Configuration</h2>
      <label for="baseUrl">Backend base URL</label>
      <input id="baseUrl" type="text" value="http://127.0.0.1:8000" />
    </section>

    <section class="card">
      <div class="buttons">
        <button id="btnGetData">Get Protected Data</button>
        <button id="btnPostData">Send POST Request</button>
      </div>
    </section>

    <section class="card">
      <h2>Response:</h2>
      <pre id="output">Click a button above to make a request…</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
