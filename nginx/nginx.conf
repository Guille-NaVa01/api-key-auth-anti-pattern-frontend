server {
    listen 80;
    server_name localhost;

    # ── Static frontend files ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend running on the host.
    # The x-api-key header is injected HERE — it never reaches the browser.
    location /api/ {
        proxy_pass http://host.docker.internal:8000;

        # Inject the API key server-side (value substituted by entrypoint.sh)
        proxy_set_header x-api-key __API_KEY__;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Drop any x-api-key the browser might try to send (defence in depth)
        proxy_hide_header x-api-key;
    }
}
